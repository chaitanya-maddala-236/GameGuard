services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gameguard
      POSTGRES_USER: gameguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-gameguard-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameguard -d gameguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gameguard:${POSTGRES_PASSWORD:-local-gameguard-password}@db:5432/gameguard
      MODEL_PATH: /app/artifacts/models/gameguard-if-v1/model.joblib
      ALLOWED_ORIGINS: http://localhost:8501
      API_KEY: ${API_KEY:-}
    command: ["sh", "-c", "python -m gameguard.migrate && uvicorn gameguard.api:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    command: ["sh", "-c", "streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
