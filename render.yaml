services:
  - type: web
    name: gameguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MODEL_PATH
        value: /app/artifacts/models/gameguard-if-v1/model.joblib
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          name: gameguard-dashboard
          type: web
          property: host

  - type: web
    name: gameguard-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/start-dashboard.sh
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: API_BASE_URL
        fromService:
          name: gameguard-api
          type: web
          property: host
      - key: API_KEY
        fromService:
          name: gameguard-api
          type: web
          envVarKey: API_KEY

