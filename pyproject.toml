[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gameguard"
version = "0.1.0"
description = "Unsupervised game-session hardware telemetry anomaly monitoring"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<25",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "psutil>=6.1,<8",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.40,<2",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/gameguard/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
